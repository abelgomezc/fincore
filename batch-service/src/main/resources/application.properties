server.port=8094
spring.application.name=batch-service

spring.datasource.url=jdbc:postgresql://localhost:5432/fincore_batch
spring.datasource.username=fincore
spring.datasource.password=fincore123
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=localhost:9092

logging.level.com.fincore.batch=DEBUG

batch.job.enabled=true
batch.conciliacion.dias.retraso=1
batch.reporte.diario.enabled=true
