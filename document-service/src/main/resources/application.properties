spring.application.name=document-service
server.port=8095

spring.datasource.url=jdbc:postgresql://localhost:5432/fincore_documents
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=localhost:9092

jwt.secret=dev-secret-key-change-me-64chars-long-for-jwt-signing-finance-core-2026
jwt.expiration=1800000
jwt.refresh-expiration=86400000

logging.level.com.fincore.document=INFO
