spring.application.name=api-gateway
server.port=8080
spring.threads.virtual.enabled=true

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Redis para rate limiting
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:redis_fincore_2026}

# JWT Secret
jwt.secret=${JWT_SECRET:fincore_jwt_hs512_secret_minimo_64_caracteres_2026_abel_gomez_banking}

# Rate Limiting: 100 requests per minute per IP
gateway.rate-limit.requests-per-minute=100
gateway.rate-limit.burst-capacity=20

# Kafka para eventos de auditoría
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Logging
logging.level.com.fincore.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO

# Management
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
