server.port=${SERVER_PORT:8081}
spring.application.name=${SPRING_APPLICATION_NAME:transfer-service}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fincore_transfer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
spring.kafka.producer.value-serializer=${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:org.springframework.kafka.support.serializer.JsonSerializer}

grpc.server.port=${GRPC_SERVER_PORT:9091}

resilience4j.circuitbreaker.register-health-indicator=${RESILIENCE4J_CIRCUITBREAKER_REGISTER_HEALTH_INDICATOR:true}
resilience4j.circuitbreaker.sliding-window-size=${RESILIENCE4J_CIRCUITBREAKER_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.minimum-number-of-calls=${RESILIENCE4J_CIRCUITBREAKER_MINIMUM_NUMBER_OF_CALLS:5}
resilience4j.circuitbreaker.failure-rate-threshold=${RESILIENCE4J_CIRCUITBREAKER_FAILURE_RATE_THRESHOLD:50}
resilience4j.retry.max-attempts=${RESILIENCE4J_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.wait-duration=${RESILIENCE4J_RETRY_WAIT_DURATION:1000}

springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}