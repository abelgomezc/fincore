syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.fincore.transfer.proto.fraud";
option java_outer_classname = "FraudProto";

package fraud;

service FraudService {
  rpc EvaluarTransferencia(EvaluacionFraudeRequest) returns (EvaluacionFraudeResponse);
}

message EvaluacionFraudeRequest {
  int64 id_transferencia = 1;
  int64 id_cuenta_origen = 2;
  string monto = 3;
  string ip_origen = 4;
  string dispositivo = 5;
  string trace_id = 6;
  int64 id_cliente = 7;
  string numero_cuenta_destino = 8;
}

message EvaluacionFraudeResponse {
  int32 score = 1;
  string decision = 2;
  string mensaje = 3;
  repeated string reglas_activadas = 4;
  int32 tiempo_evaluacion_ms = 5;
}
