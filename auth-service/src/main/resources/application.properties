spring.application.name=AUTH-SERVICE
server.port=8081
# spring.threads.virtual.enabled=true  # Deshabilitado temporalmente por bug en Spring Boot 3.2.5 con Redis Lettuce

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fincore_auth}
spring.datasource.username=${POSTGRES_USER:fincore}
spring.datasource.password=${POSTGRES_PASSWORD:fincore123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET:fincore_jwt_hs512_secret_minimo_64_caracteres_2026_abel_gomez_banking}
jwt.expiration=1800000
jwt.refresh-expiration=86400000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis_fincore_2026}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Bloqueo después de 5 intentos fallidos
auth.max.failed.attempts=5
auth.lockout.duration.minutes=30

logging.level.com.fincore.auth=INFO
logging.level.org.springframework.security=INFO

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging - save to service's logs directory
logging.file.path=logs

